<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini / ChatGPT Style Frontend</title>
  <style>
    :root {
      --sidebar-bg: #f8f9fa;
      --sidebar-border: #e5e7eb;
      --main-bg: #ffffff;
      --text-primary: #1f1f1f;
      --text-muted: #6b7280;
      --pill-hover: #e8eaed;
      --pill-active: #d3e3fd;
      --pill-active-text: #041e49;
      --new-chat-bg: #dde3ea;
      --new-chat-hover: #d0d7de;
      --card-bg: #f8f9fa;
      --card-border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      overflow: hidden;
      background: var(--main-bg);
      color: var(--text-primary);
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      min-width: 240px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--sidebar-border);
      display: flex;
      flex-direction: column;
      padding: 14px 12px;
      gap: 10px;
    }

    .new-chat-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 11px 16px;
      border: none;
      border-radius: 9999px;
      background: var(--new-chat-bg);
      color: var(--text-primary);
      font-size: 0.92rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .new-chat-btn:hover {
      background: var(--new-chat-hover);
    }

    .recent-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 10px;
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
    }

    .icon-btn:hover {
      background: var(--pill-hover);
      color: var(--text-primary);
    }

    .filter-box {
      display: none;
      padding: 0 4px;
    }

    .filter-box.open {
      display: block;
    }

    .filter-input {
      width: 100%;
      padding: 7px 12px;
      border: 1px solid var(--sidebar-border);
      border-radius: 10px;
      font-size: 0.85rem;
      outline: none;
      background: #fff;
    }

    .filter-input:focus {
      border-color: #4285f4;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-right: 2px;
    }

    .history-row {
      position: relative;
      display: flex;
      align-items: center;
      border-radius: 9999px;
      transition: background 0.15s ease;
    }

    .history-row:hover {
      background: var(--pill-hover);
    }

    .history-row.active {
      background: var(--pill-active);
    }

    .history-title-btn {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      text-align: left;
      padding: 9px 14px;
      border-radius: 9999px;
      font-size: 0.88rem;
      color: inherit;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-row.active .history-title-btn {
      color: var(--pill-active-text);
      font-weight: 500;
    }

    .menu-wrapper {
      position: relative;
      margin-right: 4px;
    }

    .menu-dropdown {
      display: none;
      position: absolute;
      right: 0;
      top: 32px;
      background: #fff;
      border: 1px solid var(--sidebar-border);
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      z-index: 20;
      min-width: 110px;
      overflow: hidden;
    }

    .menu-dropdown.open {
      display: block;
    }

    .menu-item {
      width: 100%;
      padding: 8px 12px;
      border: none;
      background: #fff;
      text-align: left;
      font-size: 0.84rem;
      cursor: pointer;
      color: var(--text-primary);
    }

    .menu-item:hover {
      background: var(--sidebar-bg);
    }

    .menu-item.delete {
      color: #b91c1c;
    }

    /* Main Content */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--main-bg);
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 24px;
    }

    .app-brand {
      font-weight: 600;
      font-size: 1rem;
    }

    .model-select {
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid #e0e6ed;
      background: #f0f4f9;
      font-size: 0.86rem;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
      outline: none;
    }

    .chat-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px 24px 32px;
    }

    .chat-container {
      max-width: 800px;
      margin: 0 auto;
    }

    /* Empty / Welcome State */
    .welcome-hero {
      margin-top: 8vh;
      margin-bottom: 28px;
    }

    .welcome-gradient {
      font-size: 3rem;
      font-weight: 600;
      line-height: 1.15;
      background: linear-gradient(90deg, #4285f4, #9b72cb, #d96570);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .welcome-sub {
      font-size: 1.4rem;
      color: #9ca3af;
      margin-top: 6px;
    }

    .suggestions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
      gap: 12px;
    }

    .suggestion-card {
      height: 110px;
      padding: 14px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      text-align: left;
      font-size: 0.86rem;
      line-height: 1.4;
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .suggestion-card:hover {
      background: #f0f4f9;
      border-color: #d2e3fc;
    }

    /* Messages */
    .message {
      display: flex;
      gap: 12px;
      padding: 14px 0;
      align-items: flex-start;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
      background: #f0f4f9;
    }

    .message-body {
      flex: 1;
      font-size: 0.95rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Composer */
    .composer-wrap {
      padding: 12px 24px 20px;
      background: var(--main-bg);
    }

    .composer-box {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--card-border);
      background: #f8f9fa;
      border-radius: 24px;
      padding: 8px 14px;
    }

    .composer-input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 0.95rem;
      padding: 6px 4px;
      outline: none;
    }

    .send-btn {
      border: none;
      background: #1f1f1f;
      color: #fff;
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
    }

    .send-btn:hover {
      background: #374151;
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <button class="new-chat-btn" id="newChatBtn">＋ New chat</button>

    <div class="recent-header">
      <span>Recent</span>
      <button class="icon-btn" id="toggleFilterBtn" title="Filter chats">▽</button>
    </div>

    <div class="filter-box" id="filterBox">
      <input
        type="text"
        class="filter-input"
        id="filterInput"
        placeholder="Search chats..."
      />
    </div>

    <div class="history-list" id="historyList"></div>
  </aside>

  <!-- Main Workspace -->
  <main class="main">
    <div class="topbar">
      <span class="app-brand" id="appBrand">Gemini</span>
      <select class="model-select" id="modelSelect"></select>
    </div>

    <div class="chat-scroll">
      <div class="chat-container" id="chatContainer"></div>
    </div>

    <div class="composer-wrap">
      <form class="composer-box" id="composerForm">
        <input
          type="text"
          class="composer-input"
          id="promptInput"
          placeholder="Ask Gemini..."
          autocomplete="off"
        />
        <button type="submit" class="send-btn">Send</button>
      </form>
    </div>
  </main>

  <!-- JSON Payload (Replace with fetch('/api/...') when ready) -->
  <script id="app-data" type="application/json">
    


  </script>

  <script>
    // =========================================================================
    // DATA LAYER: Reads from JSON now; swap loadAppData() to fetch() your REST API
    // =========================================================================
    const API_BASE = "http://127.0.0.1:8000";
    async function loadAppData() {
  try {
    const res = await fetch(`${API_BASE}/api/chats`);
    if (!res.ok) {
      throw new Error(`HTTP ${res.status} - ${res.statusText}`);
    }
    return await res.json();
  } catch (err) {
    console.error("Failed to load /api/chats:", err);
    chatContainerEl.innerHTML = `
      <div style="padding: 16px; border: 1px solid #fecaca; background: #fef2f2; color: #991b1b; border-radius: 12px; margin-top: 24px;">
        <strong>Could not load app data from FastAPI</strong><br />
        Make sure Uvicorn is running on <code>${API_BASE}</code> and <code>/api/chats</code> returns valid JSON.<br />
        <small>${err.message}</small>
      </div>
    `;
    return null;
  }
}

    async function sendMessageToBackend({ chatId, prompt, model, messages }) {
      // Example for REST API later:
      // const res = await fetch(`/api/chats/${chatId}/messages`, {
      //   method: "POST",
      //   headers: { "Content-Type": "application/json" },
      //   body: JSON.stringify({ prompt, model, messages })
      // });
      // const data = await res.json();
      // return data.reply;

      return `[${model}] Mock reply for: "${prompt}". Hook this function up to your REST API.`;
    }

    // =========================================================================
    // STATE & UI RENDERING
    // =========================================================================
    let state = {
      appTitle: "Gemini",
      models: ["Gemini 2.5 Flash"],
      suggestions: [],
      chats: [],
      activeChatId: null,
      searchQuery: "",
      openMenuId: null
    };

    const historyListEl = document.getElementById("historyList");
    const chatContainerEl = document.getElementById("chatContainer");
    const modelSelectEl = document.getElementById("modelSelect");
    const promptInputEl = document.getElementById("promptInput");
    const filterBoxEl = document.getElementById("filterBox");
    const filterInputEl = document.getElementById("filterInput");

    function getActiveChat() {
      return state.chats.find((c) => c.id === state.activeChatId) || state.chats[0];
    }

    function createNewChat() {
      const active = getActiveChat();
      const newChat = {
        id: "chat-" + Date.now(),
        title: "New Chat",
        model: active ? active.model : state.models[0],
        messages: []
      };
      state.chats.unshift(newChat);
      state.activeChatId = newChat.id;
      state.openMenuId = null;
      renderAll();
    }

    function deleteChat(chatId) {
      state.chats = state.chats.filter((c) => c.id !== chatId);
      if (!state.chats.length) {
        createNewChat();
        return;
      }
      if (state.activeChatId === chatId) {
        state.activeChatId = state.chats[0].id;
      }
      state.openMenuId = null;
      renderAll();
    }

    function renameChat(chatId) {
      const chat = state.chats.find((c) => c.id === chatId);
      if (!chat) return;
      const updated = window.prompt("Rename chat:", chat.title);
      if (updated && updated.trim()) {
        chat.title = updated.trim();
      }
      state.openMenuId = null;
      renderAll();
    }

    function renderSidebar() {
      historyListEl.innerHTML = "";
      const q = state.searchQuery.toLowerCase();
      const filtered = state.chats.filter((c) => c.title.toLowerCase().includes(q));

      filtered.forEach((chat) => {
        const isActive = chat.id === state.activeChatId;
        const row = document.createElement("div");
        row.className = `history-row ${isActive ? "active" : ""}`;

        const titleBtn = document.createElement("button");
        titleBtn.className = "history-title-btn";
        titleBtn.textContent = chat.title;
        titleBtn.title = chat.title;
        titleBtn.onclick = () => {
          state.activeChatId = chat.id;
          state.openMenuId = null;
          renderAll();
        };

        row.appendChild(titleBtn);

        if (isActive) {
          const menuWrap = document.createElement("div");
          menuWrap.className = "menu-wrapper";

          const menuBtn = document.createElement("button");
          menuBtn.className = "icon-btn";
          menuBtn.textContent = "⋮";
          menuBtn.onclick = (e) => {
            e.stopPropagation();
            state.openMenuId = state.openMenuId === chat.id ? null : chat.id;
            renderSidebar();
          };

          const dropdown = document.createElement("div");
          dropdown.className = `menu-dropdown ${state.openMenuId === chat.id ? "open" : ""}`;

          const renameBtn = document.createElement("button");
          renameBtn.className = "menu-item";
          renameBtn.textContent = "Rename";
          renameBtn.onclick = (e) => {
            e.stopPropagation();
            renameChat(chat.id);
          };

          const delBtn = document.createElement("button");
          delBtn.className = "menu-item delete";
          delBtn.textContent = "Delete";
          delBtn.onclick = (e) => {
            e.stopPropagation();
            deleteChat(chat.id);
          };

          dropdown.appendChild(renameBtn);
          dropdown.appendChild(delBtn);
          menuWrap.appendChild(menuBtn);
          menuWrap.appendChild(dropdown);
          row.appendChild(menuWrap);
        }

        historyListEl.appendChild(row);
      });
    }

    function renderTopbar() {
      const active = getActiveChat();
      document.getElementById("appBrand").textContent = state.appTitle;
      modelSelectEl.innerHTML = "";

      state.models.forEach((m) => {
        const opt = document.createElement("option");
        opt.value = m;
        opt.textContent = m;
        if (active && active.model === m) opt.selected = true;
        modelSelectEl.appendChild(opt);
      });

      promptInputEl.placeholder = `Ask ${state.appTitle}...`;
    }

    function renderMainChat() {
      const active = getActiveChat();
      chatContainerEl.innerHTML = "";

      if (!active || !active.messages.length) {
        const hero = document.createElement("div");
        hero.className = "welcome-hero";
        hero.innerHTML = `
          <div class="welcome-gradient">Hello there</div>
          <div class="welcome-sub">How can ${state.appTitle} help you today?</div>
        `;
        chatContainerEl.appendChild(hero);

        const grid = document.createElement("div");
        grid.className = "suggestions-grid";
        state.suggestions.slice(0, 4).forEach((text) => {
          const card = document.createElement("button");
          card.className = "suggestion-card";
          card.textContent = text;
          card.onclick = () => handleSend(text);
          grid.appendChild(card);
        });
        chatContainerEl.appendChild(grid);
        return;
      }

      active.messages.forEach((msg) => {
        const item = document.createElement("div");
        item.className = "message";

        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = msg.role === "user" ? "👤" : "✦";

        const body = document.createElement("div");
        body.className = "message-body";
        body.textContent = msg.content;

        item.appendChild(avatar);
        item.appendChild(body);
        chatContainerEl.appendChild(item);
      });
    }

    function renderAll() {
      renderSidebar();
      renderTopbar();
      renderMainChat();
    }

    async function handleSend(text) {
      const trimmed = text.trim();
      if (!trimmed) return;

      const active = getActiveChat();
      if (active.messages.length === 0 && active.title === "New Chat") {
        active.title = trimmed.length > 36 ? trimmed.slice(0, 36) + "..." : trimmed;
      }

      active.messages.push({ role: "user", content: trimmed });
      promptInputEl.value = "";
      renderAll();

      const reply = await sendMessageToBackend({
        chatId: active.id,
        prompt: trimmed,
        model: active.model,
        messages: active.messages
      });

      active.messages.push({ role: "assistant", content: reply });
      renderAll();
    }

    // Event Listeners
    document.getElementById("newChatBtn").onclick = createNewChat;

    document.getElementById("toggleFilterBtn").onclick = () => {
      filterBoxEl.classList.toggle("open");
      if (filterBoxEl.classList.contains("open")) {
        filterInputEl.focus();
      }
    };

    filterInputEl.oninput = (e) => {
      state.searchQuery = e.target.value;
      renderSidebar();
    };

    modelSelectEl.onchange = (e) => {
      const active = getActiveChat();
      if (active) active.model = e.target.value;
    };

    document.getElementById("composerForm").onsubmit = (e) => {
      e.preventDefault();
      handleSend(promptInputEl.value);
    };

    document.addEventListener("click", () => {
      if (state.openMenuId !== null) {
        state.openMenuId = null;
        renderSidebar();
      }
    });

    // Boot
    (async function init() {
      const payload = await loadAppData();
      if(!payload) return;
      state.appTitle = payload.app_title || "Gemini";
      state.models = payload.models && payload.models.length ? payload.models : ["Default Model"];
      state.suggestions = payload.suggestions || [];
      state.chats = (payload.chats || []).map((c, idx) => ({
        id: c.id || `chat-${idx}`,
        title: c.title || "New Chat",
        model: c.model || state.models[0],
        messages: Array.isArray(c.messages) ? c.messages : []
      }));

      if (!state.chats.length) {
        createNewChat();
      } else {
        state.activeChatId = state.chats[0].id;
        renderAll();
      }
    })();
  </script>
</body>
</html>
